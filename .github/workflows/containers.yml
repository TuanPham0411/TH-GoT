name: Test and publish standalone application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: game/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r game/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s game/tests -v
      - run: python game/tools/audit_v89_ui.py
      - run: node --test game/tests-js/session-clock.test.cjs
      - run: docker build -t standalone:test .
      - name: Image contains source and lock only; missing assets fail closed
        run: |
          docker run --rm --entrypoint python standalone:test -c "from pathlib import Path; assert not Path('/app/resource/images').exists(); assert not Path('/app/static/images').exists(); assert Path('/app/assets.lock.json').is_file()"
          if docker run --rm --network none standalone:test > startup.log 2>&1; then
            cat startup.log
            exit 1
          fi
          grep -q 'Asset setup failed:' startup.log
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        if: github.event_name != 'pull_request'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
  integration:
    # Run full-media checks by default; source/image builds do not download Drive.
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: standalone:test
      PUBLIC_URL: http://localhost:5082
      ASSETS_URL: ${{ vars.TH_GOT_ASSETS_URL || 'https://drive.google.com/file/d/1JsQk7-4mWJlmCJDd5TdDy9mnUnEm41U5/view?usp=sharing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r game/requirements.txt
      - run: python tools/assets.py install --root .assets --url "$ASSETS_URL"
      - run: python tools/assets.py verify --root .assets
      - run: ASSET_DIR="$PWD/.assets/current" python game/tools/audit_v88_complete.py
      - run: docker build -t standalone:test .
      - name: Import verified assets into the deployment volume
        run: |
          docker compose run --rm --no-deps --user 0 --entrypoint sh -v "$PWD/.assets:/import:ro" web -c 'cp -a /import/. /assets/ && chown -R 10001:10001 /assets'
      - run: docker compose up -d --no-build --wait --wait-timeout 180
      - run: python tools/smoke.py
      - if: always()
        run: |
          docker compose logs --no-color --tail 80
          docker compose down -v
