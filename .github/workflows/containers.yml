name: Test and publish standalone application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r game/requirements.txt
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise all games, age settings, accessibility and session expiry
        run: |
          python tests/browser_server.py > /tmp/browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/browser-server.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5099/healthz >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser_learning.cjs
          node tests/browser_world.cjs
          node tests/browser_realm.cjs
          node tests/browser_journeys.cjs
          node tests/browser_parents.cjs
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: game/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r game/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s game/tests -v
      - run: python game/tools/audit_v89_ui.py
      - run: node --test game/tests-js/session-clock.test.cjs
      - run: docker build -t standalone:test .
      - name: Image has no media storage and web starts without downloading images
        run: |
          docker run --rm --entrypoint python standalone:test -c "from pathlib import Path; assert not Path('/app/resource/images').exists(); assert not Path('/app/static/images').exists(); assert not Path('/assets').exists()"
          docker run -d --name setup-check --network none standalone:test
          for attempt in $(seq 1 30); do
            if docker exec setup-check python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=2)"; then
              break
            fi
            sleep 2
          done
          docker exec -i setup-check python - <<'PYTEST'
          import json
          from urllib.request import urlopen
          from urllib.error import HTTPError
          from pathlib import Path
          with urlopen('http://127.0.0.1:5000/healthz') as response:
              health=json.load(response)
          assert health['ok'] and not health['media_connected']
          for path in ('/readyz','/resource/images/missing.png'):
              try:
                  urlopen('http://127.0.0.1:5000'+path)
                  raise AssertionError('Unconfigured Drive media unexpectedly ready')
              except HTTPError as error:
                  assert error.code==503
          assert not Path('/assets').exists()
          assert not list(Path('/data').rglob('*.png'))
          assert not list(Path('/data').rglob('*.webp'))
          PYTEST
      - if: always()
        run: |
          docker logs setup-check || true
          docker rm -f setup-check || true
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        if: github.event_name != 'pull_request'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
